<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Login com chuva</title>
  <style>
    :root{
      --bg:#0f172a;
      --card:#ffffff;
      --accent:#ff6a00;
      --muted:#9a7a63;
      --danger:#b91c1c;
      font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,"Noto Sans","Apple Color Emoji","Segoe UI Emoji";
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      background: linear-gradient(180deg, rgba(255,240,230,0.02), rgba(255,245,238,0.03));
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
      -webkit-touch-callout:none;
      -webkit-user-select:none;
      user-select:none;
      overflow:hidden;
      position:relative;
    }
    #rain{
      position:fixed;
      inset:0;
      width:100%;
      height:100%;
      z-index:0;
      pointer-events:none;
      mix-blend-mode:overlay;
      opacity:0.95;
      filter: blur(0.4px) contrast(1.02);
    }
    body::before{
      content:'';
      position:fixed;
      inset:0;
      z-index:1;
      pointer-events:none;
      background:
        radial-gradient(900px 260px at 12% 8%, rgba(255,170,110,0.10), transparent 12%),
        radial-gradient(700px 220px at 88% 28%, rgba(255,140,70,0.07), transparent 14%);
      transition:opacity .3s ease;
      opacity:1;
    }
    body::after{
      content:'';
      position:fixed;
      inset:0;
      z-index:2;
      pointer-events:none;
      background: linear-gradient(120deg, rgba(255,236,225,0.0) 0%, rgba(255,150,80,0.16) 50%, rgba(255,236,225,0.0) 100%);
      transform: translateX(-120%);
      mix-blend-mode:screen;
      opacity:0.7;
      animation: sheenMove 6s linear infinite;
    }
    @keyframes sheenMove{
      0%{ transform: translateX(-120%) rotate(-6deg); opacity:0.25 }
      50%{ transform: translateX(20%) rotate(-6deg); opacity:0.65 }
      100%{ transform: translateX(120%) rotate(-6deg); opacity:0.25 }
    }
    .wrapper{width:100%;max-width:420px;z-index:2;}
    .card{
      width:100%;
      background: linear-gradient(180deg, rgba(255,255,255,0.82), rgba(255,247,241,0.78));
      border-radius:14px;
      padding:18px;
      box-shadow: 0 14px 48px rgba(15,10,8,0.18), inset 0 1px 0 rgba(255,255,255,0.7);
      backdrop-filter: blur(12px) saturate(150%);
      border: 1px solid rgba(255,170,110,0.14);
      display:flex;
      flex-direction:column;
      gap:12px;
      position:relative;
      overflow:hidden;
    }
    .card::after{
      content:'';
      position:absolute;
      top:-40%;
      left:-30%;
      width:160%;
      height:80%;
      background: linear-gradient(120deg, rgba(255,200,160,0.08), rgba(255,233,220,0.0) 35%, rgba(255,200,160,0.06) 70%, rgba(255,233,220,0.0));
      transform: rotate(-12deg) translateX(-10%);
      animation: cardSheen 4.5s linear infinite;
      pointer-events:none;
      mix-blend-mode:overlay;
      opacity:0.95;
    }
    @keyframes cardSheen{
      0%{ transform: rotate(-12deg) translateX(-18%); opacity:0.6 }
      50%{ transform: rotate(-12deg) translateX(6%); opacity:1 }
      100%{ transform: rotate(-12deg) translateX(30%); opacity:0.6 }
    }
    .inputGroup{display:flex;flex-direction:column;}
    input[type="text"],input[type="password"]{
      height:52px;
      padding:12px 14px;
      border-radius:10px;
      border:1px solid rgba(15,23,42,0.06);
      font-size:16px;
      outline:none;
      background:linear-gradient(180deg, rgba(255,255,255,0.98), rgba(250,250,250,0.95));
      color:#0f172a;
      box-shadow: inset 0 -1px 0 rgba(15,23,42,0.03);
    }
    input::placeholder{color:var(--muted);}
    .actions{display:flex;justify-content:stretch;gap:10px;margin-top:6px;}
    .btn{
      flex:1;height:50px;border-radius:10px;border:0;
      background:var(--accent);color:#fff;font-weight:600;font-size:16px;
      box-shadow: 0 8px 22px rgba(255,106,0,0.16);
    }
    .btnAlt{
      background:linear-gradient(180deg, rgba(255,245,240,0.95), rgba(255,238,230,0.95));
      color:var(--accent);border:0;box-shadow: inset 0 1px 0 rgba(255,255,255,0.6);
    }
    .visually-hidden{position:absolute!important;height:1px;width:1px;overflow:hidden;clip:rect(1px,1px,1px,1px);white-space:nowrap;}
    .modal{
      position:fixed;inset:0;display:none;align-items:center;justify-content:center;
      background:linear-gradient(180deg, rgba(2,6,23,0.3), rgba(2,6,23,0.45));
      padding:20px;z-index:3;
    }
    .modal[aria-hidden="false"]{display:flex}
    .modalCard{
      width:100%;max-width:360px;background:linear-gradient(180deg, #ffffff, #fbfdff);
      border-radius:12px;padding:18px;box-shadow:0 18px 40px rgba(2,6,23,0.22);
      text-align:left;border:1px solid rgba(15,23,42,0.04);
    }
    .modalCard h3{margin:0 0 8px 0;font-size:18px;color:#0f172a;font-weight:700;}
    .modalCard p{margin:0;font-size:15px;color:#334155;word-break:break-word;}
  </style>
</head>
<body>
  <canvas id="rain"></canvas>
  <main class="wrapper">
    <form id="loginForm" class="card" autocomplete="off" novalidate>
      <div class="inputGroup">
        <label for="username" class="visually-hidden">Nome de usuário</label>
        <input id="username" name="username" type="text" placeholder="Nome de usuário" required />
      </div>
      <div class="inputGroup">
        <label for="password" class="visually-hidden">Senha</label>
        <input id="password" name="password" type="password" placeholder="Senha" required />
      </div>
      <div class="actions">
        <button id="nextBtn" type="submit" class="btn">Avançar</button>
      </div>
    </form>
  </main>
  <div id="modal" class="modal" aria-hidden="true" role="dialog" aria-modal="true">
    <div class="modalCard">
      <h3 id="modalTitle">Senha já Utilizada</h3>
      <p id="modalContent"></p>
      <div style="display:flex;gap:10px;margin-top:12px;">
        <button id="closeBtn" class="btn btnAlt">Fechar</button>
      </div>
    </div>
  </div>
  <script>
    (function(){
      const form = document.getElementById('loginForm');
      const usernameEl = document.getElementById('username');
      const passwordEl = document.getElement
