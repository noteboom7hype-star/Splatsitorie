<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Splatsitorie</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .login-box {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.25);
      width: 300px;
      text-align: center;
    }

    .login-box h2 {
      margin-bottom: 20px;
      color: #333;
    }

    input {
      display: block;
      margin: 10px auto;
      padding: 10px;
      width: 90%;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
    }

    button {
      margin-top: 15px;
      padding: 12px;
      width: 100%;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    button:hover {
      background: #5a67d8;
    }

    /* Estilo do popup (modal) */
    .modal {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      display: none;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: white;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
      width: 320px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
      animation: fadeIn 0.3s ease;
    }

    .modal-content h3 {
      margin-bottom: 15px;
      color: #e53e3e;
    }

    .close-btn {
      margin-top: 10px;
      padding: 8px 15px;
      background: #e53e3e;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    @keyframes fadeIn {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>Splatsitorie</h2>
    <input type="text" id="username" placeholder="Usuário">
    <input type="password" id="password" placeholder="Senha">
    <button onclick="showModal()">Concluir</button>
  </div>

  <!-- Popup -->
  <div class="modal" id="errorModal">
    <div class="modal-content">
      <h3>Erro</h3>
      <p id="errorMessage"></p>
      <button class="close-btn" onclick="closeModal()">Fechar</button>
    </div>
  </div>

  <script>
    function showModal() {
      // Lista de nomes inventados
      const nomes = ["davixbixo32", "guilhermesxx", "joaopower99", "mariazinhaXP", "lucas_devPro"];
      // Escolhe um aleatório
      const nomeAleatorio = nomes[Math.floor(Math.random() * nomes.length)];
      document.getElementById('errorMessage').innerText = 
        "A senha já é usada por " + nomeAleatorio + "!";
      document.getElementById('errorModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('errorModal').style.display = 'none';
    }
  </script>
</body>
</html>
